name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.IPTV_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iptv-release.jks"
      - name: Build signed APK
        env:
          IPTV_KEYSTORE_PATH: ${{ runner.temp }}/iptv-release.jks
          IPTV_KEYSTORE_PASSWORD: ${{ secrets.IPTV_KEYSTORE_PASSWORD }}
          IPTV_KEY_ALIAS: ${{ secrets.IPTV_KEY_ALIAS }}
          IPTV_KEY_PASSWORD: ${{ secrets.IPTV_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Give APK a stable name
        run: mv app/build/outputs/apk/release/app-release.apk IPTV-TV.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: IPTV-TV.apk
          generate_release_notes: true
